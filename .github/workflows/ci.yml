name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: judge
          POSTGRES_PASSWORD: judge
          POSTGRES_DB: mango_judge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judge -d mango_judge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://judge:judge@localhost:5432/mango_judge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!@mango-write-judge/e2e' test
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter @mango-write-judge/e2e exec playwright install chromium --with-deps
      - name: E2E
        run: pnpm e2e
        env:
          E2E_ADMIN_PASSWORD: e2e-admin-password-123456
          E2E_DATABASE_URL: postgres://judge:judge@localhost:5432/judge_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
